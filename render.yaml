# Review/apply this Blueprint in Render; committing it does not migrate an API.
services:
  - type: web
    name: spectr-testops-server
    runtime: node
    rootDir: server
    plan: starter
    numInstances: 1
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: >-
      node -e "const fs = require('node:fs'); fs.closeSync(fs.openSync('/var/data/spectr.db', 'a'))" &&
      npm run prisma:push &&
      npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/spectr.db
      - key: CLIENT_URL
        value: https://spectr-testops.vercel.app
      - key: SESSION_SAME_SITE
        value: lax
      - key: SESSION_SECURE
        value: 'true'
    disk:
      name: spectr-testops-data
      mountPath: /var/data
      sizeGB: 1
