<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fundo Dark Obsidian com cantos arredondados -->
  <rect width="64" height="64" rx="16" fill="#090A0F"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
  
  <!-- Brilho radial Cyber Violet -->
  <circle cx="32" cy="32" r="26" fill="url(#violetGlow)" opacity="0.5"/>
  
  <!-- Espectro / Pulso de TestOps -->
  <!-- Linha de pulso de sinal (SLA Stream) -->
  <path d="M12 32H22L27 18L35 46L41 26L45 32H52" 
        stroke="url(#pulseGradient)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Ponto de assertion aprovada (Verde Laser) -->
  <circle cx="45" cy="32" r="3" fill="#10B981"/>
  <circle cx="45" cy="32" r="5" stroke="#10B981" stroke-width="1" opacity="0.5"/>

  <defs>
    <radialGradient id="violetGlow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulseGradient" x1="12" y1="32" x2="52" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="60%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
</svg>
